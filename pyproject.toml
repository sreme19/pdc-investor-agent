[project]
name = "pdc-investor-agent"
version = "0.1.0"
description = "Zero-API ledger CLI for investor outreach, research, and relationship tracking (Pocket Dating Coach / Riteangle fundraise)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pia = "pdc_investor_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdc_investor_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
