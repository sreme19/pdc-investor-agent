[project]
name = "pdc-investor-agent"
version = "0.1.0"
description = "Zero-API ledger CLI for investor outreach, research, and relationship tracking (Pocket Dating Coach / Riteangle fundraise)."
requires-python = ">=3.10"
# The only dependency, and only for the Apple Numbers mirror (`pia sheet`). Kept a plain
# dependency rather than an optional extra: an extra that is not installed would make the mirror
# silently stop updating, and a sheet that quietly goes stale is worse than no sheet. The ledger
# itself still needs nothing — no Anthropic client, no credentials (SPEC.md decisions 1 and 4).
dependencies = [
  "numbers-parser>=4.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pia = "pdc_investor_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdc_investor_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
